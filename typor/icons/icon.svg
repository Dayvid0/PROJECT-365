<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  <g fill="white">
    <!-- Keyboard icon -->
    <rect x="20" y="48" width="88" height="56" rx="4" fill="none" stroke="white" stroke-width="3"/>
    <!-- Keys -->
    <rect x="28" y="56" width="12" height="12" rx="2"/>
    <rect x="44" y="56" width="12" height="12" rx="2"/>
    <rect x="60" y="56" width="12" height="12" rx="2"/>
    <rect x="76" y="56" width="12" height="12" rx="2"/>
    <rect x="92" y="56" width="12" height="12" rx="2"/>
    <rect x="28" y="72" width="12" height="12" rx="2"/>
    <rect x="44" y="72" width="12" height="12" rx="2"/>
    <rect x="60" y="72" width="12" height="12" rx="2"/>
    <rect x="76" y="72" width="12" height="12" rx="2"/>
    <rect x="92" y="72" width="12" height="12" rx="2"/>
    <rect x="36" y="88" width="56" height="10" rx="2"/>
    <!-- Typing cursor/caret -->
    <rect x="56" y="24" width="3" height="20" fill="white">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="64" y="30" width="3" height="14" fill="white">
      <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="72" y="34" width="3" height="10" fill="white">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
