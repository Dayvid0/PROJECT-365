<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h2>
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 10h-5V8h5m0 11h-5v-2h5m2-14H8c-1.11 0-2 .89-2 2v14c0 1.11.89 2 2 2h8l6-6V5c0-1.11-.89-2-2-2z"/>
        </svg>
        Typing Automator
      </h2>
      <div class="activation-status" id="activationStatus">
        <span class="status-badge" id="statusBadge">
          <span class="status-icon">🔓</span>
          <span id="statusText">Trial</span>
        </span>
      </div>
    </div>

    <!-- Activation Section (shown when not activated) -->
    <div id="activationSection" class="activation-section" style="display: none;">
      <div class="machine-code-box">
        <label>Your Machine Code:</label>
        <div class="machine-code">
          <span id="machineCode">Loading...</span>
          <button id="copyMachineCode" class="icon-btn" title="Copy">📋</button>
        </div>
      </div>
      <div class="key-input-group">
        <input type="text" id="activationKey" placeholder="Enter activation key (XXXX-X-XXXXXXXXXXXX-XXXX)">
        <button id="activateBtn" class="btn btn-primary">Activate</button>
      </div>
      <div class="activation-message" id="activationMessage"></div>
      <div class="activation-actions" style="margin-top:8px; display:flex; gap:8px;">
        <button id="getKeyWhatsApp" class="btn btn-sm" title="Get via WhatsApp">WhatsApp</button>
        <button id="getKeyEmail" class="btn btn-sm" title="Get via Email">Email</button>
      </div>
    </div>

    <!-- Main App Section -->
    <div id="mainSection" class="main-section">
      <!-- Speed Control -->
      <div class="control-group">
        <label class="control-label">
          <svg class="control-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 16a3 3 0 0 1-3-3c0-.35.06-.67.17-.97l-2.1-2.1A6.96 6.96 0 0 0 5 15a7 7 0 0 0 7 7 7 7 0 0 0 7-7c0-1.94-.78-3.68-2.07-4.93l-2.1 2.1c.11.3.17.62.17.97a3 3 0 0 1-3 3m8.83-7.69A9.93 9.93 0 0 1 22 15a10 10 0 0 1-10 10A10 10 0 0 1 2 15c0-2.53.95-4.84 2.5-6.62L2 5.87l1.41-1.41 18.38 18.38L20.37 24.41l-2.04-2.04A9.91 9.91 0 0 1 12 24a8 8 0 0 1-8-8c0-1.78.58-3.42 1.57-4.74l1.48 1.48A5.96 5.96 0 0 0 6 15a6 6 0 0 0 6 6c1.12 0 2.17-.32 3.07-.85l1.72 1.72A7.91 7.91 0 0 1 12 23a7 7 0 0 1-7-7c0-1.38.41-2.66 1.1-3.74l8.64 8.64A2.97 2.97 0 0 0 15 19a3 3 0 0 0-3-3c-.35 0-.67.06-.97.17l2.1 2.1A6.96 6.96 0 0 1 19 15a7 7 0 0 0-7-7c-1.94 0-3.68.78-4.93 2.07l2.1 2.1c.3-.11.62-.17.97-.17a3 3 0 0 1 3 3m-.14-5.31l2.14 2.14A5.96 5.96 0 0 1 18 15a6 6 0 0 1-6 6c-1.12 0-2.17-.32-3.07-.85l2.14 2.14A7.91 7.91 0 0 0 12 9z"/>
          </svg>
          Typing Speed
        </label>
        <div class="speed-control">
          <input type="range" id="speedSlider" min="0.5" max="10" step="0.5" value="1">
          <div class="speed-display">
            <span id="speedValue">1.0</span>×
            <span id="speedLabel" class="speed-label">Normal</span>
          </div>
        </div>
      </div>

      <!-- Text Area -->
      <div class="control-group">
        <div class="toolbar">
          <button id="importBtn" class="btn btn-sm">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z"/>
            </svg>
            Import DOCX
          </button>
          <input type="file" id="fileInput" accept=".docx" style="display: none;">
          <button id="clearBtn" class="btn btn-sm">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M19,4H15.5L14.5,3H9.5L8.5,4H5V6H19M6,19A2,2 0 0,0 8,21H16A2,2 0 0,0 18,19V7H6V19Z"/>
            </svg>
            Clear
          </button>
          <button id="formatBtn" class="btn btn-sm" title="Clean text formatting">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M16.24,3.56L21.19,8.5C21.97,9.29 21.97,10.55 21.19,11.34L12,20.53C10.44,22.09 7.91,22.09 6.34,20.53L2.81,17C2.03,16.21 2.03,14.95 2.81,14.16L13.41,3.56C14.2,2.78 15.46,2.78 16.24,3.56M4.22,15.58L7.76,19.11C8.54,19.9 9.8,19.9 10.59,19.11L14.12,15.58L9.17,10.63L4.22,15.58Z"/>
            </svg>
            Clean
          </button>
        </div>
        <label style="display:flex; gap:6px; align-items:center; font-size:12px; margin:6px 0;">
          <input type="checkbox" id="preserveHtml"> Preserve formatting (HTML for rich editors)
        </label>
        <textarea id="textInput" placeholder="Type or paste your text here..."></textarea>
        <div class="char-count">
          <span id="charCount">0</span> characters
        </div>
        <div id="editorPicker" style="margin-top:8px; display:none;">
          <label style="font-size:12px; color:#6b7280;">Target editor (TinyMCE):</label>
          <select id="editorSelect" class="btn" style="width:100%;"></select>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="button-group">
        <button id="startBtn" class="btn btn-primary btn-lg">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8,5.14V19.14L19,12.14L8,5.14Z"/>
          </svg>
          Start Typing
        </button>
        <button id="stopBtn" class="btn btn-danger btn-lg" disabled>
          <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M18,18H6V6H18V18Z"/>
          </svg>
          Stop
        </button>
        <button id="injectClipboardBtn" class="btn btn-secondary btn-lg" style="margin-left:8px;">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M16,9V7A4,4 0 0,0 8,7V9H7A2,2 0 0,0 5,11V19A2,2 0 0,0 7,21H17A2,2 0 0,0 19,19V11A2,2 0 0,0 17,9H16M10,7A2,2 0 0,1 14,7V9H10V7M17,19H7V11H17V19Z"/>
          </svg>
          Inject Clipboard
        </button>
      </div>

      <!-- Instructions -->
      <div class="instructions">
        <p>📌 <strong>How to use:</strong></p>
        <ol>
          <li>Enter or import your text</li>
          <li>Adjust typing speed if needed</li>
          <li>Click "Start Typing"</li>
          <li>Click on any text field where you want to type</li>
        </ol>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <a href="#" id="adminLink" class="admin-link">⚙️</a>
      <span class="version">v1.0.0</span>
    </div>
  </div>

  <script src="lib/mammoth.browser.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
